<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel DPO - Agente DSAR ISO 27701</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container wide">
        <header>
            <h1>Panel del Oficial de Protección de Datos (DPO)</h1>
            <p>Supervisión de solicitudes automatizadas y cumplimiento de SLAs.</p>
        </header>

        <section class="card">
            <h2>Solicitudes Recientes</h2>
            <table class="dpo-table">
                <thead>
                    <tr>
                        <th>Ticket ID</th>
                        <th>Usuario ID</th>
                        <th>Derecho Solic.</th>
                        <th>Estado</th>
                        <th>SLA Restante</th>
                    </tr>
                </thead>
                <tbody id="dpoTableBody">
                    <tr>
                        <td>#DSAR-8921</td>
                        <td>72839102</td>
                        <td>Acceso</td>
                        <td><span class="badge success">Procesado</span></td>
                        <td>29 días</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </div>
</body>
</html>
