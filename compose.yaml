services:
  backend:
    build: .
    ports:
      - "127.0.0.1:5000:5000"
    env_file: backend/.env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://dsar:dsar_local@postgres:5432/dsar_agent
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/dsar-request
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dsar_agent
      POSTGRES_USER: dsar
      POSTGRES_PASSWORD: dsar_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dsar_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dsar -d dsar_agent"]
      interval: 5s
      timeout: 5s
      retries: 10
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.42.7
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      GENERIC_TIMEZONE: America/Lima
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

volumes:
  dsar_postgres:
  n8n_data:
